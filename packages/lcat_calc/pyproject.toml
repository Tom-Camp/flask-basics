[project]
name = "lcat-calc"
version = "0.1.0"
description = "Match work experience and education to labor categories (LCATs)."
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2",
    "ruamel-yaml>=0.19.1",
]

[dependency-groups]
dev = ["pytest>=9.1.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lcat_calc"]
# Hatch includes non-Python files under the package directory, so data/*.yaml ships in the wheel.

[tool.pytest.ini_options]
testpaths = ["tests"]
