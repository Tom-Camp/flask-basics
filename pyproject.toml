[project]
name = "flask-basics"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.19.1",
    "authlib>=1.8.0",
    "flask[async]>=3.1.3",
    "flask-login>=0.6.3",
    "flask-migrate>=4.1.0",
    "flask-sqlalchemy>=3.1.1",
    "flask-wtf>=1.3.0",
    "pydantic-ai-slim[google]>=2.57.0",
    "pypdf>=6.21.0",
    "python-dateutil>=2.9.0.post0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.3",
    "python-slugify>=9.0.0",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "commitizen>=4.18.0",
    "prek>=0.5.5",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[[tool.mypy.overrides]]
# Neither package ships type hints/stubs.
module = ["flask_login", "flask_wtf"]
ignore_missing_imports = true
